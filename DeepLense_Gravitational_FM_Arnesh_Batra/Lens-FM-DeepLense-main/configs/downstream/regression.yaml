# Axion mass regression, target log10(m / eV), axion images only.
# Effective batch 128 = 64 x 2 accumulation steps (as in the paper runs).
task: regression
data_root: ../datasets
train_dataset: Model_II
test_dataset: Model_II_test
shots: null
train_fraction: 0.8
backbone: vit_small
pretrained: runs/pretrain/lens_lejepa/lens_lejepa_model_i_seed42/last_pretrain.pt
adaptation: rslora
rank: 32
alpha: 64.0
epochs: 50
batch_size: 64
grad_accum: 2
lr: 3.0e-4
weight_decay: 0.01
val_interval: 10
seed: 42
workers: 8
output_dir: runs
