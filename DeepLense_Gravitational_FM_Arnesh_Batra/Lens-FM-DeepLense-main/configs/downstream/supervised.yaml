# Supervised baselines trained from scratch, with the paper's settings.
#   --set backbone=resnet18 | vit | vitsd | lensiformer | lenspinn
#   regression (resnet18, lenspinn):  --set task=regression weight_decay=0.01 label_smoothing=0.0
task: classification
data_root: ../datasets
train_dataset: Model_II
test_dataset: Model_II_test
backbone: resnet18
epochs: 50
batch_size: 128
lr: 3.0e-4
weight_decay: 0.05
label_smoothing: 0.1
val_interval: 10
seed: 42
workers: 8
output_dir: runs
