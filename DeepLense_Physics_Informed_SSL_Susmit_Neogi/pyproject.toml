[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeplense-physics-informed-ssl"
version = "0.1.0"
description = "Physics-informed self-supervised learning experiments for gravitational lensing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "scikit-learn",
    "tqdm",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ssl_components*", "experiments*"]
namespaces = true
